---
- name: Configure Common Prerequisites
  hosts: k3s_cluster
  become: true
  roles:
    - common

- name: Setup K3s Master Node
  hosts: master
  become: true
  roles:
    - k3s_master

- name: Setup K3s Worker Nodes
  hosts: workers
  become: true
  roles:
    - k3s_worker

- name: Deploy MetalLB LoadBalancer
  hosts: master
  become: true
  roles:
    - metallb

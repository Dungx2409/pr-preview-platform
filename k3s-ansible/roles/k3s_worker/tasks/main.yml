---
- name: Check if k3s binary exists on worker
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_worker_bin

- name: Download K3s installation script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s-install.sh
    mode: '0755'
  when: not k3s_worker_bin.stat.exists

- name: Install and join K3s agent
  ansible.builtin.command: /tmp/k3s-install.sh
  environment:
    K3S_URL: "https://{{ hostvars[groups['master'][0]]['ansible_host'] }}:6443"
    K3S_TOKEN: "{{ hostvars[groups['master'][0]]['k3s_master_token'] }}"
    INSTALL_K3S_EXEC: "agent --node-ip={{ ansible_host }} --flannel-iface={{ flannel_iface }}"
  when: not k3s_worker_bin.stat.exists
  no_log: true
  changed_when: true

- name: Ensure k3s-agent service is started and enabled
  ansible.builtin.systemd:
    name: k3s-agent
    state: started
    enabled: true

- name: Ensure /etc/rancher/k3s directory exists on worker
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: '0755'

- name: Distribute cluster kubeconfig to worker node for kubectl access
  ansible.builtin.copy:
    src: "{{ lookup('env', 'HOME') }}/.kube/k3s-lab.yaml"
    dest: /etc/rancher/k3s/k3s.yaml
    mode: '0644'
    owner: root
    group: root

[master]
k3s-master ansible_host=192.168.56.10

[workers]
worker-1 ansible_host=192.168.56.11
worker-2 ansible_host=192.168.56.12

[k3s_cluster:children]
master
workers

[k3s_cluster:vars]
# Defaults for local VirtualBox lab; can be overridden via ANSIBLE_SSH_PRIVATE_KEY_FILE
ansible_user=vboxuser
ansible_ssh_private_key_file=~/.ssh/id_ed25519
flannel_iface=enp0s8
metallb_ip_range=192.168.56.50-192.168.56.60

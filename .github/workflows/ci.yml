---
name: CI

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Safety Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install yamllint==1.38.0 ansible-lint==26.10.1 ruff==0.11.11
          pip install -r demo-app/requirements.txt -r demo-app/requirements-dev.txt
          sudo apt-get update && sudo apt-get install -y shellcheck
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Run fast static checks & linters (Fail-Fast)
        run: |
          make check-config
          make check-configmaps
          make lint-python
          make lint-yaml
          make lint-shell
          make lint-ansible

      - name: Run unit tests
        run: make test

      - name: Cache external binary tools
        id: cache-tools
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772115f6ec1 # v4.2.2
        with:
          path: |
            /usr/local/bin/gitleaks
            /usr/local/bin/kubeconform
            /usr/local/bin/trivy
          key: tools-${{ runner.os }}-gitleaks-8.27.2-kubeconform-0.6.7-trivy-0.76.1

      - name: Install gitleaks
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          GITLEAKS_VERSION="8.27.2"
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL "$URL" | sudo tar -xz -C /usr/local/bin gitleaks
          sudo chmod +x /usr/local/bin/gitleaks

      - name: Install kubeconform
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          KUBECONFORM_VERSION="0.6.7"
          URL="https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          curl -sSL "$URL" | sudo tar -xz -C /usr/local/bin kubeconform
          sudo chmod +x /usr/local/bin/kubeconform

      - name: Install trivy
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          TRIVY_VERSION="0.76.1"
          URL="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSL "$URL" | sudo tar -xz -C /usr/local/bin trivy
          sudo chmod +x /usr/local/bin/trivy

      - name: Run make helm-template
        run: make helm-template

      - name: Run security & secret scanning
        run: |
          make lint-secrets
          make lint-helm
          make lint-trivy

---
name: CI

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Safety Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.10"

      - name: Install linters
        run: |
          python3 -m pip install --upgrade pip
          pip install yamllint==1.38.0 ansible-lint==26.10.1 ruff==0.11.11
          sudo apt-get update && sudo apt-get install -y shellcheck
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION="8.27.2"
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL "$URL" | tar -xz -C /usr/local/bin gitleaks
          chmod +x /usr/local/bin/gitleaks

      - name: Install kubeconform
        run: |
          KUBECONFORM_VERSION="0.6.7"
          URL="https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          curl -sSL "$URL" | tar -xz -C /usr/local/bin kubeconform
          chmod +x /usr/local/bin/kubeconform

      - name: Install trivy
        run: |
          TRIVY_VERSION="0.76.1"
          URL="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSL "$URL" | tar -xz -C /usr/local/bin trivy
          chmod +x /usr/local/bin/trivy

      - name: Install test dependencies
        run: |
          pip install -r demo-app/requirements.txt -r demo-app/requirements-dev.txt

      - name: Run make lint
        run: make lint

      - name: Run make helm-template
        run: make helm-template

      - name: Run make test
        run: make test

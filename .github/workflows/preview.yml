---
name: Preview Build & Push

"on":
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  pull-requests: write
  deployments: write

env:
  TAILNET_NAME: taildc1471.ts.net

jobs:
  build-preview:
    name: Build, Scan & Push PR Preview Image
    if: >-
      contains(github.event.pull_request.labels.*.name, 'preview') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Load centralized configuration from values.yaml
        run: |
          python3 -c "
          import yaml
          with open('values.yaml') as f:
              cfg = yaml.safe_load(f) or {}
          print('CONFIG_REPO_LABEL=' + str(cfg.get('repo', {}).get('label', 'preview')))
          print('CONFIG_APP_NAME=' + str(cfg.get('app', {}).get('name', 'demo-app')))
          fallback_img = 'ghcr.io/${{ github.repository_owner }}/demo-app'
          print('CONFIG_APP_IMAGE=' + str(cfg.get('app', {}).get('image', fallback_img)))
          print('CONFIG_APP_PORT=' + str(cfg.get('app', {}).get('port', 8000)))
          print('CONFIG_APP_HEALTHCHECK=' + str(cfg.get('app', {}).get('healthcheck', '/healthz')))
          print('CONFIG_NS_PREFIX=' + str(cfg.get('namespace', {}).get('prefix', 'preview')))
          " >> "$GITHUB_ENV"

      - name: Set Image Name and Tag
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          SHORT_SHA_7=$(echo "${{ github.event.pull_request.head.sha }}" | cut -c1-7)
          SHORT_SHA_8=$(echo "${{ github.event.pull_request.head.sha }}" | cut -c1-8)
          IMAGE_NAME="${CONFIG_APP_IMAGE}"
          echo "IMAGE_NAME=${IMAGE_NAME}" >> "$GITHUB_ENV"
          echo "TAG_8=${CONFIG_NS_PREFIX}-${PR_NUMBER}-${SHORT_SHA_8}" >> "$GITHUB_ENV"
          echo "TAG_7=${CONFIG_NS_PREFIX}-${PR_NUMBER}-${SHORT_SHA_7}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${SHORT_SHA_7}" >> "$GITHUB_ENV"
          echo "Tags: ${CONFIG_NS_PREFIX}-${PR_NUMBER}-${SHORT_SHA_8}, ${CONFIG_NS_PREFIX}-${PR_NUMBER}-${SHORT_SHA_7}"

      - name: Build local container image
        run: |
          DESC="PR Preview image for PR #${{ github.event.pull_request.number }}"
          BUILD_DIR="${CONFIG_APP_NAME}"
          if [ ! -d "${BUILD_DIR}" ]; then
            BUILD_DIR="demo-app"
          fi
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.description=${DESC}" \
            -t "${{ env.IMAGE_NAME }}:${{ env.TAG_8 }}" \
            -t "${{ env.IMAGE_NAME }}:${{ env.TAG_7 }}" \
            "${BUILD_DIR}/"

      - name: Scan container image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ env.TAG_8 }}"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push container image to GHCR
        run: |
          docker push "${{ env.IMAGE_NAME }}:${{ env.TAG_8 }}"
          docker push "${{ env.IMAGE_NAME }}:${{ env.TAG_7 }}"

      - name: Upsert PR comment with preview link
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          PREVIEW_URL="https://${CONFIG_NS_PREFIX}-${PR_NUMBER}.${{ env.TAILNET_NAME }}/"
          ENV_NAME="${CONFIG_NS_PREFIX}-${PR_NUMBER}"
          MARKER="<!-- pr-preview-platform-comment -->"

          BODY=$(cat <<EOF
          ${MARKER}
          ### 🚀 PR Preview Environment Ready

          | Property | Value |
          |---|---|
          | **Preview URL** | [${PREVIEW_URL}](${PREVIEW_URL}) |
          | **Environment** | \`${ENV_NAME}\` |
          | **Image Tag** | \`${{ env.TAG_8 }}\` |
          | **Commit** | \`${{ env.SHORT_SHA }}\` |
          | **Status** | Pushed to GHCR; live once Argo CD reconciles (~30–60s) |

          > 🔒 **Access Note:** Reachable only by authenticated members
          > of the Tailscale tailnet (\`${{ env.TAILNET_NAME }}\`).
          EOF
          )

          COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" | head -n 1)

          if [ -n "${COMMENT_ID}" ]; then
            echo "Updating existing comment ${COMMENT_ID} on PR #${PR_NUMBER}..."
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/${COMMENT_ID}" \
              -f body="${BODY}"
          else
            echo "Creating new comment on PR #${PR_NUMBER}..."
            gh api -X POST "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
              -f body="${BODY}"
          fi

      - name: Create GitHub Deployment status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          PREVIEW_URL="https://${CONFIG_NS_PREFIX}-${PR_NUMBER}.${{ env.TAILNET_NAME }}/"
          ENV_NAME="${CONFIG_NS_PREFIX}-${PR_NUMBER}"

          echo "Creating deployment for environment ${ENV_NAME}..."
          DEPLOY_PAYLOAD=$(printf \
            '{"ref":"%s","environment":"%s","auto_merge":false,"required_contexts":[],"description":"PR #%s preview"}' \
            "${{ github.event.pull_request.head.sha }}" \
            "${ENV_NAME}" \
            "${PR_NUMBER}")

          DEPLOYMENT_ID=$(echo "${DEPLOY_PAYLOAD}" | \
            gh api -X POST "repos/${{ github.repository }}/deployments" --input - --jq '.id')

          if [ -n "${DEPLOYMENT_ID}" ] && [ "${DEPLOYMENT_ID}" != "null" ]; then
            echo "Setting deployment status to success for deployment ${DEPLOYMENT_ID}..."
            RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            FMT='{"state":"success","environment":"%s","environment_url":"%s","log_url":"%s"}'
            STATUS_PAYLOAD=$(printf "${FMT}" "${ENV_NAME}" "${PREVIEW_URL}" "${RUN_URL}")
            echo "${STATUS_PAYLOAD}" | \
              gh api -X POST "repos/${{ github.repository }}/deployments/${DEPLOYMENT_ID}/statuses" --input -
          fi

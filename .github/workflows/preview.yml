---
name: Preview Build & Push

"on":
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-preview:
    name: Build, Scan & Push PR Preview Image
    if: >-
      contains(github.event.pull_request.labels.*.name, 'preview') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set Image Name and Tag
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          PR_NUMBER="${{ github.event.pull_request.number }}"
          SHORT_SHA_7=$(echo "${{ github.event.pull_request.head.sha }}" | cut -c1-7)
          SHORT_SHA_8=$(echo "${{ github.event.pull_request.head.sha }}" | cut -c1-8)
          IMAGE_NAME="ghcr.io/${REPO_OWNER}/demo-app"
          echo "IMAGE_NAME=${IMAGE_NAME}" >> "$GITHUB_ENV"
          echo "TAG_8=pr-${PR_NUMBER}-${SHORT_SHA_8}" >> "$GITHUB_ENV"
          echo "TAG_7=pr-${PR_NUMBER}-${SHORT_SHA_7}" >> "$GITHUB_ENV"
          echo "Target Tags: pr-${PR_NUMBER}-${SHORT_SHA_8} and pr-${PR_NUMBER}-${SHORT_SHA_7}"

      - name: Build local container image
        run: |
          DESC="PR Preview image for PR #${{ github.event.pull_request.number }}"
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.description=${DESC}" \
            -t "${{ env.IMAGE_NAME }}:${{ env.TAG_8 }}" \
            -t "${{ env.IMAGE_NAME }}:${{ env.TAG_7 }}" \
            demo-app/

      - name: Scan container image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ env.TAG_8 }}"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push container image to GHCR
        run: |
          docker push "${{ env.IMAGE_NAME }}:${{ env.TAG_8 }}"
          docker push "${{ env.IMAGE_NAME }}:${{ env.TAG_7 }}"

---
name: Preview Build & Push

"on":
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  pull-requests: write
  deployments: write

env:
  TAILNET_NAME: taildc1471.ts.net

jobs:
  build-preview:
    name: Build, Scan & Push PR Preview Image
    if: >-
      contains(github.event.pull_request.labels.*.name, 'preview') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set Image Name and Tag
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          PR_NUMBER="${{ github.event.pull_request.number }}"
          SHORT_SHA_7=$(echo "${{ github.event.pull_request.head.sha }}" | cut -c1-7)
          SHORT_SHA_8=$(echo "${{ github.event.pull_request.head.sha }}" | cut -c1-8)
          IMAGE_NAME="ghcr.io/${REPO_OWNER}/demo-app"
          echo "IMAGE_NAME=${IMAGE_NAME}" >> "$GITHUB_ENV"
          echo "TAG_8=pr-${PR_NUMBER}-${SHORT_SHA_8}" >> "$GITHUB_ENV"
          echo "TAG_7=pr-${PR_NUMBER}-${SHORT_SHA_7}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${SHORT_SHA_7}" >> "$GITHUB_ENV"
          echo "Target Tags: pr-${PR_NUMBER}-${SHORT_SHA_8} and pr-${PR_NUMBER}-${SHORT_SHA_7}"

      - name: Build local container image
        run: |
          DESC="PR Preview image for PR #${{ github.event.pull_request.number }}"
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.description=${DESC}" \
            -t "${{ env.IMAGE_NAME }}:${{ env.TAG_8 }}" \
            -t "${{ env.IMAGE_NAME }}:${{ env.TAG_7 }}" \
            demo-app/

      - name: Scan container image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ env.TAG_8 }}"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push container image to GHCR
        run: |
          docker push "${{ env.IMAGE_NAME }}:${{ env.TAG_8 }}"
          docker push "${{ env.IMAGE_NAME }}:${{ env.TAG_7 }}"

      - name: Upsert PR comment with preview link
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          PREVIEW_URL="https://pr-${PR_NUMBER}.${{ env.TAILNET_NAME }}/"
          MARKER="<!-- pr-preview-platform-comment -->"

          BODY=$(cat <<EOF
          ${MARKER}
          ### 🚀 PR Preview Environment Ready

          | Property | Value |
          |---|---|
          | **Preview URL** | [${PREVIEW_URL}](${PREVIEW_URL}) |
          | **Environment** | \`pr-${PR_NUMBER}\` |
          | **Image Tag** | \`${{ env.TAG_8 }}\` |
          | **Commit** | \`${{ env.SHORT_SHA }}\` |
          | **Status** | Pushed to GHCR; live once Argo CD reconciles (~30–60s) |

          > 🔒 **Access Note:** Reachable only by authenticated members
          > of the Tailscale tailnet (\`${{ env.TAILNET_NAME }}\`).
          EOF
          )

          COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" | head -n 1)

          if [ -n "${COMMENT_ID}" ]; then
            echo "Updating existing comment ${COMMENT_ID} on PR #${PR_NUMBER}..."
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/${COMMENT_ID}" \
              -f body="${BODY}"
          else
            echo "Creating new comment on PR #${PR_NUMBER}..."
            gh api -X POST "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
              -f body="${BODY}"
          fi

      - name: Create GitHub Deployment status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          PREVIEW_URL="https://pr-${PR_NUMBER}.${{ env.TAILNET_NAME }}/"
          ENV_NAME="pr-${PR_NUMBER}"

          echo "Creating deployment for environment ${ENV_NAME}..."
          DEPLOYMENT_ID=$(gh api -X POST "repos/${{ github.repository }}/deployments" --input - <<EOF | jq -r '.id'
          {
            "ref": "${{ github.event.pull_request.head.sha }}",
            "environment": "${ENV_NAME}",
            "auto_merge": false,
            "required_contexts": [],
            "description": "Preview environment for PR #${PR_NUMBER}"
          }
          EOF
          )

          if [ -n "${DEPLOYMENT_ID}" ] && [ "${DEPLOYMENT_ID}" != "null" ]; then
            echo "Setting deployment status to success for deployment ${DEPLOYMENT_ID}..."
            gh api -X POST "repos/${{ github.repository }}/deployments/${DEPLOYMENT_ID}/statuses" --input - <<EOF
            {
              "state": "success",
              "environment": "${ENV_NAME}",
              "environment_url": "${PREVIEW_URL}",
              "log_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "description": "Preview image built and deployed to ${ENV_NAME}"
            }
            EOF
          fi

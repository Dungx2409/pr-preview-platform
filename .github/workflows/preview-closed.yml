---
name: Preview Teardown & Cleanup

"on":
  pull_request:
    types:
      - closed
      - unlabeled

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  pull-requests: write
  deployments: write

env:
  TAILNET_NAME: taildc1471.ts.net

jobs:
  teardown-preview:
    name: Clean Up PR Preview Artifacts & State
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        (github.event.action == 'unlabeled' && github.event.label.name == 'preview') ||
        (github.event.action == 'closed' && contains(github.event.pull_request.labels.*.name, 'preview'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.1

      - id: config
        name: Load centralized configuration from values.yaml
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          python3 -c "
          import json, os, yaml
          with open('values.yaml') as f:
              cfg = yaml.safe_load(f) or {}
          repo_owner = os.environ.get('REPO_OWNER', 'dungx2409').lower()
          services = []
          if cfg.get('services'):
              for s in cfg['services']:
                  name = str(s.get('name', 'demo-app'))
                  services.append({
                      'name': name,
                      'image': str(s.get('image', f'ghcr.io/{repo_owner}/{name}')),
                      'port': int(s.get('port', 8000)),
                      'healthcheck': str(s.get('healthcheck', '/healthz')),
                      'buildDir': str(s.get('buildDir') or name),
                      'path': str(s.get('path', '/')),
                  })
          else:
              app = cfg.get('app', {})
              name = str(app.get('name', 'demo-app'))
              fallback_img = f'ghcr.io/{repo_owner}/{name}'
              services.append({
                  'name': name,
                  'image': str(app.get('image', fallback_img)),
                  'port': int(app.get('port', 8000)),
                  'healthcheck': str(app.get('healthcheck', '/healthz')),
                  'buildDir': str(app.get('buildDir', name)),
                  'path': '/',
              })
          services_json = json.dumps(services)
          ns_prefix = str(cfg.get('namespace', {}).get('prefix', 'preview'))
          print('services=' + services_json)
          print('ns_prefix=' + ns_prefix)
          print('CONFIG_SERVICES=' + services_json)
          print('CONFIG_NS_PREFIX=' + ns_prefix)
          " | tee -a "$GITHUB_OUTPUT" >> "$GITHUB_ENV"

      - name: Deactivate GitHub Deployments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          ENV_NAME="${CONFIG_NS_PREFIX}-${PR_NUMBER}"
          echo "Finding active deployments for environment ${ENV_NAME}..."

          DEPLOYMENT_IDS=$(gh api "repos/${{ github.repository }}/deployments?environment=${ENV_NAME}" \
            --jq '.[].id' 2>/dev/null || true)

          if [ "${ENV_NAME}" != "pr-${PR_NUMBER}" ]; then
            LEGACY_IDS=$(gh api "repos/${{ github.repository }}/deployments?environment=pr-${PR_NUMBER}" \
              --jq '.[].id' 2>/dev/null || true)
            DEPLOYMENT_IDS="${DEPLOYMENT_IDS} ${LEGACY_IDS}"
          fi

          if [ -n "${DEPLOYMENT_IDS// }" ]; then
            for dep_id in ${DEPLOYMENT_IDS}; do
              [ -z "${dep_id}" ] && continue
              echo "Deactivating deployment ${dep_id}..."
              gh api -X POST "repos/${{ github.repository }}/deployments/${dep_id}/statuses" \
                -f state="inactive" \
                -f description="Preview environment ${ENV_NAME} torn down" || true
            done
          else
            echo "No active deployments found for ${ENV_NAME}."
          fi

      - name: Delete GHCR image tags for PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVICES_JSON: ${{ steps.config.outputs.services }}
        run: |
          set -euo pipefail

          PR_NUMBER="${{ github.event.pull_request.number }}"
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SERVICES="${SERVICES_JSON:-${CONFIG_SERVICES:-[]}}"

          TAG_PREFIX_1="${CONFIG_NS_PREFIX}-${PR_NUMBER}-"
          TAG_PREFIX_2="pr-${PR_NUMBER}-"
          JQ_QUERY=".[] | select(.metadata.container.tags[]? | "
          JQ_QUERY+="(startswith(\"${TAG_PREFIX_1}\") or startswith(\"${TAG_PREFIX_2}\"))) | .id"

          # Loop over all services parsed from values.yaml (same matrix-loading pattern as preview.yml / fromJson)
          for PACKAGE_NAME in $(echo "${SERVICES}" | jq -r '.[].name'); do
            [ -z "${PACKAGE_NAME}" ] && continue
            echo "Querying GHCR versions for package ${PACKAGE_NAME} matching ${TAG_PREFIX_1}* or ${TAG_PREFIX_2}*..."

            VERSION_IDS=$(gh api \
              "users/${REPO_OWNER}/packages/container/${PACKAGE_NAME}/versions" \
              --paginate \
              --jq "${JQ_QUERY}" 2>/dev/null \
              | sort -u || true)

            if [ -n "${VERSION_IDS}" ]; then
              for vid in ${VERSION_IDS}; do
                echo "Deleting package ${PACKAGE_NAME} version ID ${vid}..."
                if ! gh api --method DELETE \
                  "users/${REPO_OWNER}/packages/container/${PACKAGE_NAME}/versions/${vid}"; then
                  echo "Retrying delete via /user/packages endpoint..."
                  gh api --method DELETE \
                    "user/packages/container/${PACKAGE_NAME}/versions/${vid}" || true
                fi
              done
            else
              echo "No GHCR package versions found for package ${PACKAGE_NAME} (PR #${PR_NUMBER})."
            fi
          done

      - name: Update PR comment with teardown status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          MARKER="<!-- pr-preview-platform-comment -->"
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          ENV_NAME="${CONFIG_NS_PREFIX}-${PR_NUMBER}"

          BODY=$(cat <<EOF
          ${MARKER}
          ### 🧹 Preview Environment Deactivated

          Preview environment for **PR #${PR_NUMBER}** has been dismantled:
          - **Environment:** \`${ENV_NAME}\`
          - **Status:** Inactive & cleaned up
          - **Cluster resources:** Namespace \`${ENV_NAME}\`, pods, and Tailscale proxy removed
          - **Images:** Container tags \`${CONFIG_NS_PREFIX}-${PR_NUMBER}-*\` deleted from GHCR
          - **Deactivated at:** \`${TIMESTAMP}\`

          > ℹ️ **Note:** Argo CD cascades namespace pruning via \`resources-finalizer\`.
          EOF
          )

          COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" | head -n 1)

          if [ -n "${COMMENT_ID}" ]; then
            echo "Updating comment ${COMMENT_ID} on PR #${PR_NUMBER}..."
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/${COMMENT_ID}" \
              -f body="${BODY}"
          else
            echo "Creating teardown comment on PR #${PR_NUMBER}..."
            gh api -X POST "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
              -f body="${BODY}"
          fi

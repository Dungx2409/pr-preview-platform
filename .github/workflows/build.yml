---
name: Build & Push Shared Image

"on":
  push:
    branches:
      - main
    paths:
      - "demo-app/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  build-and-push:
    name: Build, Scan & Push
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Load centralized configuration from values.yaml
        run: |
          python3 -c "
          import yaml
          with open('values.yaml') as f:
              cfg = yaml.safe_load(f) or {}
          print('CONFIG_APP_NAME=' + str(cfg.get('app', {}).get('name', 'demo-app')))
          fallback_img = 'ghcr.io/${{ github.repository_owner }}/demo-app'
          print('CONFIG_APP_IMAGE=' + str(cfg.get('app', {}).get('image', fallback_img)))
          " >> "$GITHUB_ENV"

      - name: Set Image Name and Tag
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          IMAGE_NAME="${CONFIG_APP_IMAGE}"
          echo "IMAGE_NAME=${IMAGE_NAME}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${SHORT_SHA}" >> "$GITHUB_ENV"

      - name: Build local container image
        run: |
          BUILD_DIR="${CONFIG_APP_NAME}"
          if [ ! -d "${BUILD_DIR}" ]; then
            BUILD_DIR="demo-app"
          fi
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            -t "${{ env.IMAGE_NAME }}:${{ env.SHORT_SHA }}" \
            "${BUILD_DIR}/"

      - name: Scan container image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ env.SHORT_SHA }}"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push container image to GHCR
        run: |
          docker push "${{ env.IMAGE_NAME }}:${{ env.SHORT_SHA }}"

      - name: Create PR to bump shared image tag in values-shared.yaml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sed -i "s/^gitSha: .*/gitSha: \"${{ env.SHORT_SHA }}\"/" charts/app/values-shared.yaml
          sed -i "s/^  tag: .*/  tag: \"${{ env.SHORT_SHA }}\"/" charts/app/values-shared.yaml

          if git diff --quiet charts/app/values-shared.yaml; then
            echo "values-shared.yaml already up to date; nothing to commit."
            exit 0
          fi

          BRANCH_NAME="automation/bump-shared-${{ env.SHORT_SHA }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH_NAME"
          git add charts/app/values-shared.yaml
          git commit -m "chore: bump shared image to ${{ env.SHORT_SHA }}"
          git push -u origin "$BRANCH_NAME" --force

          if ! gh pr view "$BRANCH_NAME" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh pr create \
              --repo "${{ github.repository }}" \
              --base main \
              --head "$BRANCH_NAME" \
              --title "chore: bump shared image to ${{ env.SHORT_SHA }}" \
              --body "Automated PR from build.yml to update values-shared.yaml (${{ env.SHORT_SHA }})."
          fi

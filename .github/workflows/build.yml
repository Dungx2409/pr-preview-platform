---
name: Build & Push Shared Image

"on":
  push:
    branches:
      - main
    paths:
      - "demo-app/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build, Scan & Push
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set Image Name and Tag
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(git rev-parse --short HEAD)
          IMAGE_NAME="ghcr.io/${REPO_OWNER}/demo-app"
          echo "IMAGE_NAME=${IMAGE_NAME}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${SHORT_SHA}" >> "$GITHUB_ENV"

      - name: Build local container image
        run: |
          docker build \
            -t "${{ env.IMAGE_NAME }}:${{ env.SHORT_SHA }}" \
            -t "${{ env.IMAGE_NAME }}:latest" \
            demo-app/

      - name: Scan container image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ env.SHORT_SHA }}"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push container images to GHCR
        run: |
          docker push "${{ env.IMAGE_NAME }}:${{ env.SHORT_SHA }}"
          docker push "${{ env.IMAGE_NAME }}:latest"

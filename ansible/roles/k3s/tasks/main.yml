---
- name: Tải script cài k3s
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s-install.sh
    mode: "0755"

- name: Cài k3s server
  ansible.builtin.command:
    cmd: /tmp/k3s-install.sh
    creates: /usr/local/bin/k3s        # đã có thì bỏ qua = idempotent
  environment:
    INSTALL_K3S_EXEC: >-
      server
      --node-ip {{ k3s_node_ip }}
      --advertise-address {{ k3s_node_ip }}
      --flannel-iface {{ k3s_flannel_iface }}
      --tls-san {{ k3s_node_ip }}
      --write-kubeconfig-mode 644

- name: Chờ node Ready
  ansible.builtin.command: k3s kubectl get nodes
  register: k3s_nodes
  until: "' Ready' in k3s_nodes.stdout"
  retries: 20
  delay: 6
  changed_when: false

- name: Fetch kubeconfig to host (stored OUTSIDE the repo — see SPEC §6.2)
  ansible.builtin.fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "{{ kubeconfig_local_path }}"
    flat: true

- name: Fix server address in kubeconfig (127.0.0.1 → host-only VM IP)
  ansible.builtin.replace:
    path: "{{ kubeconfig_local_path }}"
    regexp: "https://127.0.0.1:6443"
    replace: "https://{{ k3s_node_ip }}:6443"
  delegate_to: localhost
  become: false

---
# Default values for charts/app.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

# Environment metadata
env: ""
pr:
  number: ""
gitSha: ""

# Demo application image
image:
  repository: ghcr.io/dungx2409/demo-app
  pullPolicy: IfNotPresent
  tag: "1.0.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# ServiceAccount configuration
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Pod security settings (app pod)
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

# Container security settings (app container)
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

# App service
service:
  type: ClusterIP
  port: 80
  targetPort: 8000

# Private Ingress via Tailscale operator
ingress:
  enabled: true
  className: tailscale
  hostname: ""
  annotations: {}

# App resource requests and limits
resources:
  limits:
    cpu: 250m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

# Probes
probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    path: /readyz
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3

# Ephemeral PostgreSQL database instance
postgres:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  service:
    port: 5432
  user: postgres
  password: "preview-pg-secret"
  database: appdb
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 70
    runAsGroup: 70
    fsGroup: 70
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 70
    runAsGroup: 70
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  resources:
    limits:
      cpu: 250m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

# Optional Namespace creation with Pod Security Standards labels
namespace:
  create: false
  name: ""
  podSecurity:
    enforce: baseline
    enforceVersion: latest
    warn: restricted
    warnVersion: latest
    audit: restricted
    auditVersion: latest

# ResourceQuota enforcement
resourceQuota:
  enabled: true
  hard:
    requestsCpu: "600m"
    requestsMemory: "512Mi"
    limitsCpu: "1500m"
    limitsMemory: "1Gi"
    pods: "10"
    persistentvolumeclaims: "2"

# LimitRange defaults and bounds
limitRange:
  enabled: true
  defaultLimit:
    cpu: "300m"
    memory: "256Mi"
  defaultRequest:
    cpu: "50m"
    memory: "64Mi"
  max:
    cpu: "1000m"
    memory: "512Mi"
  min:
    cpu: "10m"
    memory: "16Mi"

# NetworkPolicy zero-trust isolation
networkPolicy:
  enabled: true
  tailscaleNamespace: tailscale
  allowExternalEgress: false


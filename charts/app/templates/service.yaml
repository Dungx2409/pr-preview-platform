{{- range $index, $svc := include "app.services" . | fromYamlArray }}
{{- if $index }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "app.serviceFullname" (list $ $svc) }}
  labels:
    {{- include "app.serviceLabels" (list $ $svc) | nindent 4 }}
spec:
  type: {{ $.Values.service.type }}
  ports:
    - port: {{ $.Values.service.port }}
      targetPort: {{ $svc.port }}
      protocol: TCP
      name: http
  selector:
    {{- include "app.serviceSelectorLabels" (list $ $svc) | nindent 4 }}
{{- end }}

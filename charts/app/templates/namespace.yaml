{{- if .Values.namespace.create -}}
{{- $nsPrefix := (get (.Values.namespace | default dict) "prefix") | default "preview" -}}
{{- $nsName := .Values.namespace.name -}}
{{- if not $nsName -}}
  {{- if and .Values.pr (hasKey .Values.pr "number") .Values.pr.number -}}
    {{- $nsName = printf "%s-%v" $nsPrefix .Values.pr.number -}}
  {{- else -}}
    {{- $nsName = .Release.Namespace -}}
  {{- end -}}
{{- end -}}
{{- $previewLabel := (get (.Values.repo | default dict) "label") | default "preview" -}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $nsName }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
    app.kubernetes.io/component: namespace
    {{- if .Values.pr.number }}
    {{ $previewLabel }}: "true"
    pr: {{ .Values.pr.number | quote }}
    {{- end }}
    pod-security.kubernetes.io/enforce: {{ .Values.namespace.podSecurity.enforce | default "baseline" | quote }}
    pod-security.kubernetes.io/enforce-version: {{ .Values.namespace.podSecurity.enforceVersion | default "latest" | quote }}
    pod-security.kubernetes.io/warn: {{ .Values.namespace.podSecurity.warn | default "restricted" | quote }}
    pod-security.kubernetes.io/warn-version: {{ .Values.namespace.podSecurity.warnVersion | default "latest" | quote }}
    pod-security.kubernetes.io/audit: {{ .Values.namespace.podSecurity.audit | default "restricted" | quote }}
    pod-security.kubernetes.io/audit-version: {{ .Values.namespace.podSecurity.auditVersion | default "latest" | quote }}
{{- end }}

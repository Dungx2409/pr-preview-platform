{{- if .Values.ingress.enabled -}}
{{- $fullName := include "app.fullname" . -}}
{{- $svcPort := .Values.service.port -}}
{{- $nsPrefix := (get (.Values.namespace | default dict) "prefix") | default "preview" -}}
{{- $hostname := .Values.ingress.hostname -}}
{{- if not $hostname -}}
  {{- if and .Values.pr (hasKey .Values.pr "number") .Values.pr.number -}}
    {{- $hostname = printf "%s-%v" $nsPrefix .Values.pr.number -}}
  {{- else -}}
    {{- $hostname = $fullName -}}
  {{- end -}}
{{- end -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingress
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | default "tailscale" }}
  rules:
    - host: {{ $hostname }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $svcPort }}
  tls:
    - hosts:
        - {{ $hostname }}
{{- end }}

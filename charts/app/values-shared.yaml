---
# Values for Tier 1 shared environment (shared-main)
env: shared
pr:
  number: ""
gitSha: "55c3886"

image:
  repository: ghcr.io/dungx2409/demo-app
  tag: "55c3886"
  pullPolicy: Always

# Multi-service workloads configuration (Tier 1 shared environment)
services:
  - name: demo-app                    # unique; k8s component label + GHCR package name
    image: ghcr.io/dungx2409/demo-app # full image repo WITHOUT tag
    port: 8000
    healthcheck: /healthz
    buildDir: demo-app                # optional, default = name
    path: /                           # optional, default = /

ingress:
  enabled: true
  className: tailscale
  hostname: shared

# Namespace configuration with Pod Security Standards
namespace:
  create: true
  name: shared
  podSecurity:
    enforce: baseline
    enforceVersion: latest
    warn: restricted
    warnVersion: latest
    audit: restricted
    auditVersion: latest

# ResourceQuota tuned with higher headroom for shared environment
resourceQuota:
  enabled: true
  hard:
    requestsCpu: "1000m"
    requestsMemory: "1Gi"
    limitsCpu: "2000m"
    limitsMemory: "2Gi"
    pods: "15"
    persistentvolumeclaims: "4"

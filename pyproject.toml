[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["demo-app/tests", "exporter/tests"]
pythonpath = ["demo-app/src", "exporter/src"]

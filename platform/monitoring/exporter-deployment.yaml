---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: preview-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: preview-exporter
    app.kubernetes.io/part-of: pr-preview-platform
    app.kubernetes.io/component: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: preview-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: preview-exporter
        app.kubernetes.io/part-of: pr-preview-platform
        app.kubernetes.io/component: observability
    spec:
      serviceAccountName: preview-exporter
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: python:3.10-slim
          command: ["python3", "/app/exporter.py"]
          env:
            - name: EXPORTER_PORT
              value: "8000"
          ports:
            - name: http-metrics
              containerPort: 8000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http-metrics
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http-metrics
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: script
              mountPath: /app/exporter.py
              subPath: exporter.py
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: script
          configMap:
            name: preview-exporter-script
        - name: tmp
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: preview-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: preview-exporter
    app.kubernetes.io/part-of: pr-preview-platform
    app.kubernetes.io/component: observability
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: preview-exporter
  ports:
    - name: http-metrics
      port: 8000
      targetPort: http-metrics
      protocol: TCP

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: preview-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: preview-exporter
    app.kubernetes.io/part-of: pr-preview-platform
    app.kubernetes.io/component: observability
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: preview-exporter
  endpoints:
    - port: http-metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s

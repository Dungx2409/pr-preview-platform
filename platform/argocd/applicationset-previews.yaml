---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: previews
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: pr-preview-platform
    app.kubernetes.io/component: applicationset
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - pullRequest:
              github:
                owner: Dungx2409
                repo: pr-preview-platform
                labels:
                  - preview
                tokenRef:
                  secretName: github-token
                  key: token
              requeueAfterSeconds: 30
          - git:
              repoURL: https://github.com/Dungx2409/pr-preview-platform.git
              revision: HEAD
              files:
                - path: "values.yaml"
  template:
    metadata:
      name: 'preview-{{ .namespace.prefix }}-{{ .number }}'
      labels:
        app.kubernetes.io/part-of: pr-preview-platform
        app.kubernetes.io/instance: 'preview-{{ .namespace.prefix }}-{{ .number }}'
        preview: "true"
        pr: '{{ .number }}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: previews
      source:
        repoURL: '{{ .repo.url }}'
        targetRevision: '{{ .head_sha }}'
        path: charts/app
        helm:
          valueFiles:
            - /values.yaml
          valuesObject:
            env: '{{ .namespace.prefix }}-{{ .number }}'
            pr:
              number: '{{ .number }}'
            gitSha: '{{ .head_sha }}'
            image:
              tag: '{{ .namespace.prefix }}-{{ .number }}-{{ .head_short_sha }}'
            ingress:
              className: tailscale
              hostname: '{{ .namespace.prefix }}-{{ .number }}'
            namespace:
              create: true
              name: '{{ .namespace.prefix }}-{{ .number }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace.prefix }}-{{ .number }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: reaper
  namespace: argocd
  labels:
    app.kubernetes.io/name: reaper
    app.kubernetes.io/part-of: pr-preview-platform
    app.kubernetes.io/component: safety-net
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: reaper
            app.kubernetes.io/part-of: pr-preview-platform
        spec:
          serviceAccountName: reaper
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reaper
              image: python:3.10-slim
              command: ["python3", "/app/reaper.py"]
              env:
                - name: DRY_RUN
                  value: "true"
                - name: PREVIEW_TTL_HOURS
                  value: "24"
                - name: GITHUB_REPO
                  value: "Dungx2409/pr-preview-platform"
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: github-token
                      key: token
                      optional: true
              securityContext:
                runAsNonRoot: true
                runAsUser: 10001
                runAsGroup: 10001
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              volumeMounts:
                - name: script
                  mountPath: /app/reaper.py
                  subPath: reaper.py
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: script
              configMap:
                name: reaper-script
            - name: tmp
              emptyDir: {}
